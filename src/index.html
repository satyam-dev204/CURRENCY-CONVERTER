<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convert currencies quickly with live exchange rates.">
    <meta name="theme-color" content="#f3f7f6">
    <title>Currency Converter | Live Exchange Rates</title>
  <link href="./output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
    referrerpolicy="no-referrer">
</head>
<body>
    <main class="app-shell">
        <div class="ambient-shape ambient-shape-one" aria-hidden="true"></div>
        <div class="ambient-shape ambient-shape-two" aria-hidden="true"></div>
        <form class="converter-card">
            <header class="app-header">
                <div class="brand-mark" aria-hidden="true">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </div>
                <div>
                    <p class="eyebrow">SMART EXCHANGE</p>
                    <h1>Currency Converter</h1>
                    <p class="subtitle">Convert currencies quickly with live exchange rates.</p>
                </div>
    </header>
            <div class="converter-body">
                <div class="input amount-field">
                    <label for="amount">Amount</label>
                    <div class="amount-input-wrap">
                        <span aria-hidden="true">$</span>
                        <input id="amount" type="number" min="0.01" step="0.01" value="1" inputmode="decimal" required>
                    </div>
                </div>

                <div class="country currency-pair">
                    <div class="currency-field from">
                        <label for="from-currency">From</label>
                        <div class="currency-select-wrap">
                            <img src="https://flagsapi.com/US/flat/64.png" alt="United States flag">
                            <div class="currency-copy">
                                <span class="currency-name" data-currency-name="from">United States Dollar</span>
                                <select id="from-currency" name="from" aria-label="Currency to convert from"></select>
                            </div>
                            <i class="fa-solid fa-chevron-down select-chevron" aria-hidden="true"></i>
            </div>
                    </div>
                    <button class="swap-button" type="button" aria-label="Swap currencies" title="Swap currencies">
                        <i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i>
                    </button>
                    <div class="currency-field to">
                        <label for="to-currency">To</label>
                        <div class="currency-select-wrap">
                            <img src="https://flagsapi.com/IN/flat/64.png" alt="India flag">
                            <div class="currency-copy">
                                <span class="currency-name" data-currency-name="to">Indian Rupee</span>
                                <select id="to-currency" name="to" aria-label="Currency to convert to"></select>
                            </div>
                            <i class="fa-solid fa-chevron-down select-chevron" aria-hidden="true"></i>
            </div>
                    </div>
                </div>

                <section class="output result-panel" aria-live="polite" aria-atomic="true">
                    <div class="result-heading">
                        <span class="status-indicator" aria-hidden="true"></span>
                        <span id="result-status">Fetching live rate</span>
                    </div>
                    <p id="result" class="result-value">Loading exchange rate...</p>
                    <p id="result-rate" class="result-rate">Your latest conversion will appear here.</p>
                </section>

                <button class="convert-button" type="submit">
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                    <span>Convert</span>
                </button>
            </div>
            <footer class="card-footer">
                <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                <span>Rates are updated from a live exchange service</span>
            </footer>
        </form>
    </main>
    <script src="./code.js" defer></script>
</body>
</html>
